<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webetnes Games</title>
    <meta name="description" content="Free browser games by Webetnes. Instant play, no download, works on phone and desktop." />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #0d1117; color: #eef2f7; }
      main { max-width: 960px; margin: 0 auto; padding: 48px 20px 64px; }
      header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 2rem; letter-spacing: -0.01em; }
      header p { margin: 0; color: #9aa6b8; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .card { display: grid; gap: 8px; align-content: start; padding: 22px; border-radius: 16px; background: var(--bg); color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.08); transition: transform .15s ease; min-height: 190px; }
      .card:hover { transform: translateY(-3px); }
      .genre { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
      .card h2 { margin: 0; font-size: 1.5rem; }
      .card p { margin: 0; color: rgba(255,255,255,.8); }
      .play { margin-top: auto; justify-self: start; padding: 8px 18px; border-radius: 999px; background: var(--accent); color: #0d1117; font-weight: 700; }
      footer { margin-top: 40px; color: #6f7b8d; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Webetnes</h1>
        <p>Small games, instant play, phone or desktop.</p>
      </header>
      <div class="grid"><!--GAMES--></div>
      <footer>Made by Ekhalios. Test builds, no ads.</footer>
    </main>
  </body>
</html>
